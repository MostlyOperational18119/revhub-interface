# Builds the Flatpak for x86_64 and aarch64 and publishes a signed Flatpak
# repository to GitHub Pages. Runs on version tags (v*) or manually.
name: Flatpak repository

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APP_ID: io.github.mostlyoperational18119.RevHubInterface

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml and the AppStream metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^version = \"$version\"" Cargo.toml || {
            echo "::error::Set version = \"$version\" in Cargo.toml before tagging"
            exit 1
          }
          grep -q "<release version=\"$version\"" packaging/flatpak/$APP_ID.metainfo.xml || {
            echo "::error::Add <release version=\"$version\" date=\"...\"/> to packaging/flatpak/$APP_ID.metainfo.xml before tagging"
            exit 1
          }

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/cache@v4
        with:
          path: packaging/flatpak/.flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}
          restore-keys: flatpak-builder-${{ matrix.arch }}-

      - name: Build
        working-directory: packaging/flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --disable-rofiles-fuse --force-clean --default-branch=stable \
            --state-dir=.flatpak-builder --repo=repo build-dir "$APP_ID.yml"
          tar -cf "$GITHUB_WORKSPACE/repo-${{ matrix.arch }}.tar" repo

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          merge-multiple: true

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - id: pages
        uses: actions/configure-pages@v5

      - name: Assemble signed repository
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [[ -z $FLATPAK_GPG_PRIVATE_KEY ]]; then
            echo "::error::The FLATPAK_GPG_PRIVATE_KEY secret is not set; run packaging/flatpak/make-signing-key.sh"
            exit 1
          fi
          for tarball in repo-*.tar; do
            dir=${tarball%.tar}
            mkdir "$dir" && tar -xf "$tarball" -C "$dir" --strip-components=1
          done
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent' EXIT
          gpg --batch --import <<< "$FLATPAK_GPG_PRIVATE_KEY"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          packaging/flatpak/publish-repo.sh site "$BASE_URL" "$key" repo-x86_64 repo-aarch64

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
