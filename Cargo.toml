[package]
name = "revhub_interface"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
env_logger = "0.11.11"
log = "0.4.34"
qtbridge = { version = "0.3", features = ["serde_json"] }
rusb = "0.9"
serde_json = "1.0.152"
serialport = { version = "4", default-features = false }
thiserror = "2.0.21"

[[bin]]
name = "revhub-interface"
path = "src/main.rs"

[profile.release]
lto = "thin"
